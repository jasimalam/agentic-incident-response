frr defaults traditional
hostname upstream
service integrated-vtysh-config
!
ip forwarding
!
interface eth1
 description probe-link
 ip address 203.0.113.2/30
!
interface eth2
 description srl-a-link
 ip address 10.0.1.1/30
!
ip route 198.51.100.0/24 10.0.1.2
!
ip prefix-list LAB-OUT seq 10 permit 198.51.100.0/24
ip prefix-list LAB-OUT seq 20 permit 203.0.113.0/30
ip prefix-list LAB-IN seq 10 permit 198.51.100.128/25
!
route-map LAB-OUT permit 10
 match ip address prefix-list LAB-OUT
!
route-map LAB-IN permit 10
 match ip address prefix-list LAB-IN
!
router bgp 65000
 bgp router-id 10.0.1.1
 bgp log-neighbor-changes
 neighbor 10.0.1.2 remote-as 65001
 neighbor 10.0.1.2 description srl-a
 neighbor 10.0.1.2 route-map LAB-IN in
 neighbor 10.0.1.2 route-map LAB-OUT out
 ! SRL-B originates the more-specific route during the simulated hijack.
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 203.0.113.0/30
  neighbor 10.0.1.2 activate
 exit-address-family
!
